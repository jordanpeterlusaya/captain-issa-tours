<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pricing admin · Captain Issa</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Syne:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .admin { max-width: 680px; margin: 0 auto; padding: 5rem var(--pad, 1.2rem) 3rem; }
    .admin h1 { font-size: 2.4rem; margin-bottom: .4rem; }
    .admin .lede { color: var(--muted); margin-bottom: 1.5rem; }
    .admin-form { display: grid; gap: 1rem; }
    fieldset { border: 1px solid var(--line); background: #fff; padding: 1rem; margin: 0; }
    legend { font-family: var(--font-display); padding: 0 .3rem; }
    .admin-actions { display: flex; flex-wrap: wrap; gap: .7rem; }
    .admin-status { min-height: 1.3em; color: var(--sea); }
    .back { display: inline-block; margin-bottom: 1rem; color: var(--gold); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .78rem; }
  </style>
</head>
<body>
  <main class="admin">
    <a class="back" href="index.html">← Site</a>
    <h1>Pricing</h1>
    <p class="lede">Boat packages are without food. Meals are separate. Leave extra-hour empty if not set.</p>
    <form class="admin-form" id="admin-form">
      <fieldset>
        <legend>Tours (no food)</legend>
        <div class="row">
          <label class="field"><span>Prison TSh</span><input name="prisonTsh" type="number" min="0" required /></label>
          <label class="field"><span>Prison USD</span><input name="prisonUsd" type="number" min="0" step="0.01" required /></label>
        </div>
        <div class="row">
          <label class="field"><span>Nakupenda TSh</span><input name="nakupendaTsh" type="number" min="0" required /></label>
          <label class="field"><span>Nakupenda USD</span><input name="nakupendaUsd" type="number" min="0" step="0.01" required /></label>
        </div>
        <div class="row">
          <label class="field"><span>Both islands TSh</span><input name="comboTsh" type="number" min="0" required /></label>
          <label class="field"><span>Both islands USD</span><input name="comboUsd" type="number" min="0" step="0.01" required /></label>
        </div>
        <div class="row">
          <label class="field"><span>Max guests</span><input name="maxGuests" type="number" min="1" max="20" required /></label>
          <label class="field"><span>Standard hours</span><input name="includedHours" type="number" min="1" required /></label>
        </div>
        <div class="row">
          <label class="field"><span>Extra hour TSh</span><input name="extraHourRateTsh" type="number" min="0" placeholder="Empty = unset" /></label>
          <label class="field"><span>Extra hour USD</span><input name="extraHourRateUsd" type="number" min="0" step="0.01" placeholder="Empty = unset" /></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Entrance tickets</legend>
        <div class="row">
          <label class="field"><span>Prison foreign $</span><input name="prisonForeignUsd" type="number" min="0" step="0.01" required /></label>
          <label class="field"><span>Prison local TSh</span><input name="prisonLocalTsh" type="number" min="0" required /></label>
        </div>
        <div class="row">
          <label class="field"><span>Marine foreign $</span><input name="marineForeignUsd" type="number" min="0" step="0.01" required /></label>
          <label class="field"><span>Marine local TSh</span><input name="marineLocalTsh" type="number" min="0" required /></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Meals (extra)</legend>
        <div class="row">
          <label class="field"><span>Seafood TSh</span><input name="seafoodPrice" type="number" min="0" required /></label>
          <label class="field"><span>Seafood USD</span><input name="seafoodUsd" type="number" min="0" step="0.01" placeholder="Optional" /></label>
        </div>
        <div class="row">
          <label class="field"><span>Seafood serves</span><input name="seafoodServes" type="number" min="1" required /></label>
          <label class="field"><span>Chicken TSh</span><input name="chickenPrice" type="number" min="0" required /></label>
        </div>
        <div class="row">
          <label class="field"><span>Chicken USD</span><input name="chickenUsd" type="number" min="0" step="0.01" placeholder="Optional" /></label>
          <label class="field"><span>Chicken serves</span><input name="chickenServes" type="number" min="1" required /></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Exchange</legend>
        <label class="field"><span>1 USD = ? TSh</span><input name="usdToTsh" type="number" min="0" placeholder="Empty = no conversion" /></label>
      </fieldset>
      <div class="admin-actions">
        <button class="btn btn--dark" type="submit">Save</button>
        <button class="btn btn--light" type="button" id="reset-defaults">Reset</button>
      </div>
      <p class="admin-status" id="admin-status"></p>
    </form>
  </main>
  <script src="js/pricing-config.js"></script>
  <script>
    (() => {
      const C = window.CaptainIssaPricingConfig;
      const form = document.getElementById("admin-form");
      const status = document.getElementById("admin-status");
      const n = (v) => (v === "" || v == null ? null : Number(v));

      function fill() {
        const c = C.getConfig();
        form.prisonTsh.value = c.tours.prison.priceTsh;
        form.prisonUsd.value = c.tours.prison.priceUsd;
        form.nakupendaTsh.value = c.tours.nakupenda.priceTsh;
        form.nakupendaUsd.value = c.tours.nakupenda.priceUsd;
        form.comboTsh.value = c.tours.combo.priceTsh;
        form.comboUsd.value = c.tours.combo.priceUsd;
        form.maxGuests.value = c.boat.maxGuests;
        form.includedHours.value = c.boat.includedHours;
        form.extraHourRateTsh.value = c.boat.extraHourRateTsh ?? "";
        form.extraHourRateUsd.value = c.boat.extraHourRateUsd ?? "";
        form.prisonForeignUsd.value = c.tickets.prisonIsland.foreignUsd;
        form.prisonLocalTsh.value = c.tickets.prisonIsland.localTsh;
        form.marineForeignUsd.value = c.tickets.marineConservation.foreignUsd;
        form.marineLocalTsh.value = c.tickets.marineConservation.localTsh;
        const seafood = c.meals.options.find((m) => m.id === "seafood");
        const chicken = c.meals.options.find((m) => m.id === "chicken-rice");
        form.seafoodPrice.value = seafood.priceTsh;
        form.seafoodUsd.value = seafood.priceUsd ?? "";
        form.seafoodServes.value = seafood.serves;
        form.chickenPrice.value = chicken.priceTsh;
        form.chickenUsd.value = chicken.priceUsd ?? "";
        form.chickenServes.value = chicken.serves;
        form.usdToTsh.value = c.exchange.usdToTsh ?? "";
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        C.saveOverrides({
          displayCurrency: "USD",
          boat: {
            maxGuests: Number(form.maxGuests.value),
            includedHours: Number(form.includedHours.value),
            extraHourRateTsh: n(form.extraHourRateTsh.value),
            extraHourRateUsd: n(form.extraHourRateUsd.value),
          },
          tours: {
            prison: {
              id: "prison",
              label: "Prison Island",
              hours: Number(form.includedHours.value),
              priceTsh: Number(form.prisonTsh.value),
              priceUsd: Number(form.prisonUsd.value),
              includesMeal: false,
            },
            nakupenda: {
              id: "nakupenda",
              label: "Nakupenda Beach",
              hours: Number(form.includedHours.value),
              priceTsh: Number(form.nakupendaTsh.value),
              priceUsd: Number(form.nakupendaUsd.value),
              includesMeal: false,
            },
            combo: {
              id: "combo",
              label: "Prison Island + Nakupenda",
              hours: Number(form.includedHours.value),
              priceTsh: Number(form.comboTsh.value),
              priceUsd: Number(form.comboUsd.value),
              includesMeal: false,
            },
          },
          tickets: {
            prisonIsland: {
              foreignUsd: Number(form.prisonForeignUsd.value),
              localTsh: Number(form.prisonLocalTsh.value),
            },
            marineConservation: {
              foreignUsd: Number(form.marineForeignUsd.value),
              localTsh: Number(form.marineLocalTsh.value),
            },
          },
          meals: {
            options: [
              {
                id: "seafood",
                label: "Seafood package",
                description: "Fish, prawns, squid, chips and drinks",
                priceTsh: Number(form.seafoodPrice.value),
                priceUsd: n(form.seafoodUsd.value),
                serves: Number(form.seafoodServes.value),
                enabled: true,
              },
              {
                id: "chicken-rice",
                label: "Chicken and rice package",
                description: "Chicken and rice for the table",
                priceTsh: Number(form.chickenPrice.value),
                priceUsd: n(form.chickenUsd.value),
                serves: Number(form.chickenServes.value),
                enabled: true,
              },
            ],
          },
          exchange: { usdToTsh: n(form.usdToTsh.value) },
        });
        status.textContent = "Saved on this browser.";
      });

      document.getElementById("reset-defaults").onclick = () => {
        C.clearOverrides();
        fill();
        status.textContent = "Defaults restored.";
      };
      fill();
    })();
  </script>
</body>
</html>
